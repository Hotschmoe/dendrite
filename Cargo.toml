[package]
name = "dendrite"
version = "0.7.0"
edition = "2021"
description = "Codebase mapping and dependency analysis tool for systems programmers"
authors = ["hotschmoe"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hotschmoe/dendrite"
keywords = ["dependency-analysis", "codebase", "graph", "zig", "systems"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dendrite"
path = "src/main.rs"

[dependencies]
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
ignore = "0.4"
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
once_cell = "1.19"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
handlebars = "6.2"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3.10"
